name: Build & Release

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Frontend build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: |
          if [ "${{ github.ref }}" = "refs/heads/next" ]; then
            npm run build -- --base=/watch/
          else
            npm run build
          fi
        env:
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'main' || 'nightly' }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlistr-dist
          path: dist/
          retention-days: 7

  release:
    name: Frontend release
    needs: check-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    permissions:
      contents: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: watchlistr-dist
          path: dist

      - name: Zip dist directory
        run: |
          cd dist
          zip -r ../watchlistr-dist.zip .

      - name: Set Release Parameters
        id: params
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Build" >> $GITHUB_OUTPUT
            echo "release_body=Automated frontend static bundle built from the main branch." >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=nightly" >> $GITHUB_OUTPUT
            echo "release_name=Nightly Build" >> $GITHUB_OUTPUT
            echo "release_body=Automated frontend static bundle built from the next branch." >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag_name }}
          name: ${{ steps.params.outputs.release_name }}
          body: ${{ steps.params.outputs.release_body }}
          make_latest: ${{ steps.params.outputs.make_latest }}
          prerelease: ${{ steps.params.outputs.prerelease == 'true' }}
          files: watchlistr-dist.zip

  docker:
    name: Proxy image build and publish
    needs: check-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercased image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${OWNER,,}/ttvdb-proxy" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/next' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
