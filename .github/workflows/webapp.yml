name: Webapp

on:
  push:
    branches: [ "main", "next" ]
  pull_request:
    branches: [ "main", "next" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      webapp: ${{ steps.filter.outputs.webapp }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            webapp:
              - 'webapp/**'
              - 'mise.toml'
              - '.github/workflows/**'

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Run linter
        working-directory: webapp
        run: npm run lint

      - name: Build frontend
        working-directory: webapp
        run: |
          if [ "${{ github.ref }}" = "refs/heads/next" ]; then
            npm run build -- --base=/watch/
          else
            npm run build
          fi
        env:
          VITE_APP_ENV: ${{ github.ref == 'refs/heads/main' && 'main' || 'nightly' }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchlistr-dist
          path: webapp/dist/
          retention-days: 7

  release:
    name: Release
    needs: [ changes, build ]
    if: needs.changes.outputs.webapp == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: watchlistr-dist
          path: dist

      - name: Zip dist directory
        run: |
          cd dist
          zip -r ../watchlistr-dist.zip .

      - name: Set Release Parameters
        id: params
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Build" >> $GITHUB_OUTPUT
            echo "release_body=Automated frontend static bundle built from the main branch." >> $GITHUB_OUTPUT
            echo "make_latest=true" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag_name=nightly" >> $GITHUB_OUTPUT
            echo "release_name=Nightly Build" >> $GITHUB_OUTPUT
            echo "release_body=Automated frontend static bundle built from the next branch." >> $GITHUB_OUTPUT
            echo "make_latest=false" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.params.outputs.tag_name }}
          name: ${{ steps.params.outputs.release_name }}
          body: ${{ steps.params.outputs.release_body }}
          make_latest: ${{ steps.params.outputs.make_latest }}
          prerelease: ${{ steps.params.outputs.prerelease == 'true' }}
          files: watchlistr-dist.zip
